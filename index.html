<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonBit 内部员工社媒数据</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#182230;font:15px/1.5 system-ui}main{max-width:1280px;margin:auto;padding:40px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;margin:0}small{color:#7a8492}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:30px 0}.card,.table{background:white;border:1px solid #e6e9ef;border-radius:12px}.card{padding:22px}.value{font-size:30px;margin-top:12px;font-weight:650}.filters{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}input,select{font:inherit;padding:10px 14px;border:1px solid #dbe0e7;background:white;border-radius:8px}.table{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:13px;color:#687386;background:#fafbfc;padding:17px}td{padding:60px 15px;text-align:center;color:#8b94a1;border-top:1px solid #eceff3}.note{margin-top:15px;color:#8b94a1;font-size:13px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header{align-items:start;flex-direction:column}main{padding:26px 16px}}</style><main><header><h1>MoonBit 内部员工社媒数据</h1><small>尚未接入数据</small></header><div class="stats"><div class="card"><small>参与员工</small><div class="value">—</div></div><div class="card"><small>发布内容</small><div class="value">—</div></div><div class="card"><small>总曝光 / 阅读 / 播放</small><div class="value">—</div></div><div class="card"><small>有效访问</small><div class="value">—</div></div><div class="card"><small>预计奖金（元）</small><div class="value">—</div></div></div><div class="filters"><input type="search" placeholder="搜索员工或内容" aria-label="搜索员工或内容"><select aria-label="平台"><option>全部平台</option><option>X</option><option>微信公众号</option><option>知乎</option><option>掘金</option><option>CSDN</option><option>B站</option><option>YouTube</option><option>小红书</option><option>抖音</option><option>LinkedIn</option><option>其他</option></select><input type="month" aria-label="统计月份" value="2026-11"></div><div class="table"><table><thead><tr><th>员工</th><th>平台</th><th>发布内容</th><th>发布时间</th><th>曝光 / 阅读 / 播放</th><th>点赞</th><th>评论</th><th>转发</th><th>有效访问</th><th>预计奖金</th></tr></thead><tbody><tr><td colspan="10" id="empty">暂无真实数据</td></tr></tbody></table></div><p class="note">— 表示数据未提供。不同平台的曝光、阅读与播放保留各自口径。</p></main><script>document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{document.getElementById('empty').textContent='暂无符合条件的真实数据'}));</script></html>
